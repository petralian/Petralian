# Names only — never commit secret values.
secrets:
  BREVO_API_KEY:
    github_environment: production
    consumers: [petralian, sitemonitor]
  CRON_SECRET:
    github_environment: production
    consumers: [petralian]
  UNSUBSCRIBE_SECRET:
    github_environment: production
    consumers: [petralian]
  VPS_HOST:
    github_repo_secrets: [Petralian, ops, sitemonitor, petralian-private]
  VPS_USER:
    github_repo_secrets: [Petralian, ops, sitemonitor, petralian-private]
  VPS_SSH_KEY:
    github_repo_secrets: [Petralian, ops, sitemonitor, petralian-private]
  PETRALIAN_PRIVATE_READ_TOKEN:
    github_repo_secrets: [Petralian]
    note: Fine-grained PAT, contents read on petralian/petralian-private, for Obsidian vault CI checkout
