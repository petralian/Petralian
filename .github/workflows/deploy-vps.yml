# Deploy Petralian to VPS over SSH
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (Settings → Secrets → Actions)
# Paths SSOT: data/deploy.yaml

name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    # Skip when auto-publish only committed content ([skip ci] in message)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit != null &&
       !contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2245
          script_stop: true
          command_timeout: 15m
          script: |
            cd /www/wwwroot/petralian
            bash scripts/deploy-on-vps.sh
